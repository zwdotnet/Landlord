services:
  landlord:
    image: ${LANDLORD_IMAGE:-landlord:0.10.0-20261111-final}
    container_name: landlord
    restart: unless-stopped
    ports:
      - "127.0.0.1:18930:8910"
    volumes:
      - /var/lib/landlord/data:/app/data
      - type: bind
        source: ./web
        target: /app/web
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - /var/lib/landlord/bootstrap.env
    environment:
      GOMEMLIMIT: 192MiB
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 160
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/8910; printf 'GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; head -n 1 <&3 | grep -q ' 200 '"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
